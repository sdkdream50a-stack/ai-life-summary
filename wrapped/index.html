  <script>
    // i18n translations
    const i18n = {
      ko: {
        loading: '로딩 중...',
        notAvailableTitle: '곧 공개됩니다!',
        notAvailableText: '연말결산은 12월 1일부터 1월 31일까지 이용 가능합니다.\n연말에 다시 방문해주세요!',
        backToHome: '홈으로 돌아가기'
      },
      en: {
        loading: 'Loading...',
        notAvailableTitle: 'Coming Soon!',
        notAvailableText: 'Year-end Wrapped is available from December 1st to January 31st.\nCome back during the holiday season!',
        backToHome: 'Back to Home'
      },
      ja: {
        loading: '読み込み中...',
        notAvailableTitle: '近日公開！',
        notAvailableText: '年末まとめは12月1日から1月31日まで利用可能です。\n年末にまたお越しください！',
        backToHome: 'ホームへ戻る'
      },
      zh: {
        loading: '加载中...',
        notAvailableTitle: '即将推出！',
        notAvailableText: '年终总结将于12月1日至1月31日期间开放。\n年末请再次访问！',
        backToHome: '返回首页'
      },
      es: {
        loading: 'Cargando...',
        notAvailableTitle: '¡Próximamente!',
        notAvailableText: 'El resumen anual está disponible del 1 de diciembre al 31 de enero.\n¡Vuelve durante las fiestas!',
        backToHome: 'Volver al inicio'
      }
    };

    let currentLang = 'ko';

    // Detect language
    function detectLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const langParam = urlParams.get('lang');
      if (langParam && i18n[langParam]) return langParam;

      const saved = localStorage.getItem('ai-life-summary-lang');
      if (saved && i18n[saved]) return saved;

      const browserLang = navigator.language.split('-')[0];
      return i18n[browserLang] ? browserLang : 'ko';
    }

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || i18n.en[key] || key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerHTML = t(key).replace(/\n/g, '<br>');
      });
    }

    // Toast function
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      toast.style.cssText = `
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.75rem 1.5rem;
        background: ${type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#6366f1'};
        color: #fff;
        border-radius: 9999px;
        font-size: 0.875rem;
        z-index: 1000;
        animation: fadeIn 0.3s ease;
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Initialize
    async function init() {
      try {
        currentLang = detectLanguage();
        applyTranslations();

        // Initialize user data
        if (typeof userDataManager !== 'undefined') {
          await userDataManager.initialize();
        }

        // Check if wrapped managers exist
        if (typeof wrappedDataManager === 'undefined') {
          console.error('wrappedDataManager not loaded');
          throw new Error('Required scripts not loaded');
        }

        // Initialize wrapped data
        wrappedDataManager.initialize(currentLang);

        // Check availability (for demo, always show)
        const isAvailable = wrappedDataManager.isAvailable();
        const forceShow = new URLSearchParams(window.location.search).get('preview') === 'true';

        // Hide loading
        document.getElementById('wrapped-loading').style.display = 'none';

        if (isAvailable || forceShow) {
          // Show wrapped
          document.getElementById('wrapped-main').style.display = 'block';

          // Get stats
          const stats = wrappedDataManager.getStats();

          // Initialize slides
          if (typeof wrappedSlides !== 'undefined') {
            wrappedSlides.initialize(stats, currentLang);
          }

          // Initialize share
          if (typeof wrappedShare !== 'undefined') {
            wrappedShare.initialize(stats, currentLang);
          }
        } else {
          // Show not available
          document.getElementById('wrapped-not-available').style.display = 'flex';
        }
      } catch (error) {
        console.error('Wrapped init error:', error);
        // Hide loading and show error state
        document.getElementById('wrapped-loading').style.display = 'none';
        document.getElementById('wrapped-not-available').style.display = 'flex';
        document.querySelector('[data-i18n="notAvailableTitle"]').textContent = 'Oops!';
        document.querySelector('[data-i18n="notAvailableText"]').textContent =
          currentLang === 'ko'
            ? '일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'
            : 'Something went wrong. Please try again later.';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
