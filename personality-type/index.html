<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 16 Personality Type Test | 성격 유형 테스트 - AI Test Lab</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://smartaitest.com/personality-type/">

    <!-- Hreflang Tags for SEO -->
    <link rel="alternate" hreflang="en" href="https://smartaitest.com/en/personality-type/">
    <link rel="alternate" hreflang="ko" href="https://smartaitest.com/ko/personality-type/">
    <link rel="alternate" hreflang="ja" href="https://smartaitest.com/ja/personality-type/">
    <link rel="alternate" hreflang="zh" href="https://smartaitest.com/zh/personality-type/">
    <link rel="alternate" hreflang="es" href="https://smartaitest.com/es/personality-type/">
    <link rel="alternate" hreflang="x-default" href="https://smartaitest.com/en/personality-type/">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Open Graph for crawlers -->
    <meta property="og:url" content="https://smartaitest.com/personality-type/">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader p {
            opacity: 0.8;
            font-size: 14px;
        }
        noscript {
            display: block;
            text-align: center;
            padding: 20px;
        }
        noscript a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        noscript a:hover {
            background: #4f46e5;
        }
    </style>

    <script>
    (function() {
        var supportedLangs = ['en', 'ko', 'ja', 'zh', 'es'];
        var targetPath = 'personality-type/';

        // Priority 1: Check localStorage for saved preference
        var saved = localStorage.getItem('ai-life-summary-lang');
        if (saved && supportedLangs.indexOf(saved) !== -1) {
            redirect(saved);
            return;
        }

        // Priority 2: Check URL parameters (?lang=ko or ?hl=ko)
        var params = new URLSearchParams(window.location.search);
        var urlLang = params.get('lang') || params.get('hl');
        if (urlLang) {
            var code = urlLang.split('-')[0].toLowerCase();
            if (supportedLangs.indexOf(code) !== -1) {
                localStorage.setItem('ai-life-summary-lang', code);
                redirect(code);
                return;
            }
        }

        // Priority 3: Detect from browser language
        var browserLangs = navigator.languages || [navigator.language];
        var detectedLang = 'en'; // default

        var langCodes = browserLangs.map(function(l) {
            return l.split('-')[0].toLowerCase();
        });

        if (langCodes.indexOf('ko') !== -1) {
            detectedLang = 'ko';
        } else {
            for (var i = 0; i < langCodes.length; i++) {
                if (supportedLangs.indexOf(langCodes[i]) !== -1) {
                    detectedLang = langCodes[i];
                    break;
                }
            }
        }

        localStorage.setItem('ai-life-summary-lang', detectedLang);
        redirect(detectedLang);

        function redirect(lang) {
            var url = '/' + lang + '/' + targetPath;
            window.location.replace(url);
        }
    })();
    </script>
    <!-- AdSense via consent-manager.js -->
    <script src="/js/consent-manager.js"></script>
</head>

            <a href="/zh/personality-type/">🇨🇳 中文</a>
            <a href="/es/personality-type/">🇪🇸 Español</a>
        </div>
    </noscript>
</body>
</html>
