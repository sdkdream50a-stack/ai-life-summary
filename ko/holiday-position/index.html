  };

  var $ = function (id) { return document.getElementById(id); };
  var qIndex = 0;
  var scores = {};   /* key → 총점 */
  var primaryCounts = {}; /* key → 주 횟수 (동점 규칙) */
  var currentPos = null;

  /* KPI 이벤트 — gtag 있으면 전송, 없으면 no-op (GA4 설치는 운영자 잔여) */
  function track(name) {
    try {
      if (typeof window.gtag === 'function') window.gtag('event', name);
    } catch (e) { /* 계측 실패가 UX를 막지 않게 */ }
  }

  function showScreen(id) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function hexToRgb(hex) {
    var h = hex.replace('#', '');
    return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
  }
  function rgbToHex(r, g, b) {
    var to = function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); };
    return '#' + to(r) + to(g) + to(b);
  }
  function mixWithWhite(hex, amount) {
    var c = hexToRgb(hex);
    return rgbToHex(c.r + (255 - c.r) * amount, c.g + (255 - c.g) * amount, c.b + (255 - c.b) * amount);
  }
  function darken(hex, amount) {
    var c = hexToRgb(hex);
    return rgbToHex(c.r * (1 - amount), c.g * (1 - amount), c.b * (1 - amount));
  }
  function pad2(v) { return ('0' + v).slice(-2); }

  /* ── 문항 진행 ── */
  function renderQuestion() {
    var item = QUESTIONS[qIndex];
    $('progressNum').textContent = (qIndex + 1) + ' / ' + QUESTIONS.length;
    $('progressFill').style.width = ((qIndex) / QUESTIONS.length * 100) + '%';
    $('qText').textContent = 'Q' + (qIndex + 1) + '. ' + item.q;

    var wrap = $('opts');
    wrap.innerHTML = '';
    for (var i = 0; i < item.opts.length; i++) {
      (function (idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt';
        btn.textContent = item.opts[idx];
        btn.addEventListener('click', function () { answer(idx); });
        wrap.appendChild(btn);
      })(i);
    }
  }

  function answer(optIdx) {
    var m = QUESTIONS[qIndex].map[optIdx];
    scores[m[0]] = (scores[m[0]] || 0) + 1;
    primaryCounts[m[0]] = (primaryCounts[m[0]] || 0) + 1;
    scores[m[1]] = (scores[m[1]] || 0) + 0.5;

    qIndex++;
    if (qIndex < QUESTIONS.length) {
      renderQuestion();
    } else {
      $('progressFill').style.width = '100%';
      finish();
    }
  }

  function computeWinner() {
    var best = null;
    for (var key in POSITIONS) {
      var s = scores[key] || 0;
      var p = primaryCounts[key] || 0;
      if (!best || s > best.s || (s === best.s && p > best.p)) {
        best = { key: key, s: s, p: p };
      }
    }
    return best.key;
  }

  function finish() {
    var key = computeWinner();
    var pos = POSITIONS[key];
    currentPos = pos;

    var root = document.documentElement.style;
    root.setProperty('--pos-color', pos.hex);
    root.setProperty('--pos-color-soft', mixWithWhite(pos.hex, 0.45));
    root.setProperty('--pos-color-deep', darken(pos.hex, 0.14));

    var now = new Date();
    $('dateLine').textContent = now.getFullYear() + ' 명절 포지션 · 나의 결과';
    $('posEmoji').textContent = pos.emoji;
    $('posName').textContent = pos.name;
    $('posDesc').textContent = pos.desc;
    $('posQuote').textContent = pos.quote;
    $('posCombi').textContent = pos.combi;
    $('cardNo').textContent = 'NO. ' + pad2(now.getMonth() + 1) + pad2(now.getDate());

    var reveals = document.querySelectorAll('#screen-result .reveal');
    for (var i = 0; i < reveals.length; i++) {
      var el = reveals[i];
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    }
    showScreen('screen-result');
    track('hq_complete');
  }

  /* ── 카드 PNG 렌더 (1080×1920, 외부 라이브러리 없음) ── */
  function wrapText(ctx, text, maxWidth) {
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function renderCardPNG(pos, cb) {
    var W = 1080, H = 1920, Pd = 84;
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    var ink = '#16130F';
    var font = function (weight, px) {
      return weight + ' ' + px + 'px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    };

    var grad = ctx.createLinearGradient(0, 0, W * 0.35, H);
    grad.addColorStop(0, mixWithWhite(pos.hex, 0.45));
    grad.addColorStop(0.55, pos.hex);
    grad.addColorStop(1, darken(pos.hex, 0.14));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = ink;

    /* head */
    ctx.font = font(800, 46);
    ctx.fillText('명절 포지션 테스트', Pd, Pd + 46);
    ctx.font = font(600, 30);
    ctx.globalAlpha = 0.65;
    ctx.textAlign = 'right';
    ctx.fillText('smartaitest.com', W - Pd, Pd + 42);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;

    var now = new Date();
    ctx.globalAlpha = 0.55;
    ctx.font = font(500, 34);
    ctx.fillText(now.getFullYear() + ' 명절 포지션 · 나의 결과', Pd, Pd + 126);
    ctx.globalAlpha = 1;

    /* emoji + name */
    ctx.font = '120px -apple-system, "Apple Color Emoji", sans-serif';
    ctx.fillText(pos.emoji, Pd, 640);
    ctx.font = font(700, 92);
    var nameLines = wrapText(ctx, pos.name, W - Pd * 2);
    var y = 780;
    for (var i = 0; i < nameLines.length; i++) { ctx.fillText(nameLines[i], Pd, y); y += 108; }

    /* desc */
    ctx.globalAlpha = 0.82;
    ctx.font = font(500, 40);
    var descLines = wrapText(ctx, pos.desc, W - Pd * 2);
    y += 30;
    for (var d = 0; d < descLines.length; d++) { ctx.fillText(descLines[d], Pd, y); y += 60; }
    ctx.globalAlpha = 1;

    /* quote */
    y += 40;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(Pd, y - 44, W - Pd * 2, 96);
    ctx.fillStyle = 'rgba(22,19,15,0.35)';
    ctx.fillRect(Pd, y - 44, 8, 96);
    ctx.fillStyle = ink;
    ctx.font = 'italic 600 40px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(pos.quote, Pd + 36, y + 16);

    /* combi */
    y += 130;
    ctx.globalAlpha = 0.8;
    ctx.font = font(600, 34);
    var combiLines = wrapText(ctx, pos.combi, W - Pd * 2);
    for (var c = 0; c < combiLines.length; c++) { ctx.fillText(combiLines[c], Pd, y); y += 52; }
    ctx.globalAlpha = 1;

    /* foot */
    ctx.globalAlpha = 0.55;
    ctx.font = font(600, 28);
    ctx.fillText('HOLIDAY POSITION', Pd, H - 70);
    ctx.textAlign = 'right';
    ctx.fillText('NO. ' + pad2(now.getMonth() + 1) + pad2(now.getDate()), W - Pd, H - 70);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;

    canvas.toBlob(cb, 'image/png');
  }

  /* ── 공유/저장 ── */
  function copyShareLink(text, url) {
    var tmp = document.createElement('textarea');
    tmp.value = text + ' ' + url;
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(tmp);
    $('shareBtn').textContent = '링크가 복사되었어요';
    setTimeout(function () { $('shareBtn').textContent = '가족 단톡방에 공유하기'; }, 1600);
    track('hq_share_fallback_copy');
  }

  $('startBtn').addEventListener('click', function () {
    qIndex = 0; scores = {}; primaryCounts = {}; currentPos = null;
    track('hq_start');
    renderQuestion();
    showScreen('screen-quiz');
  });

  $('shareBtn').addEventListener('click', function () {
    if (!currentPos) return;
    track('hq_share_attempt');
    renderCardPNG(currentPos, function (blob) {
      var file = null;
      if (blob && typeof File === 'function') {
        try { file = new File([blob], 'holiday-position.png', { type: 'image/png' }); } catch (e) {}
      }
      var posSlug = Object.keys(POSITIONS).filter(function (k) { return POSITIONS[k] === currentPos; })[0];
      var shareData = {
        title: '우리집 명절 포지션 테스트',
        text: '나는 우리집 \'' + currentPos.name + '\' ' + currentPos.emoji + ' — \'' + currentPos.tagName + '\' 포지션은 우리집에 누구게? 태그해봐',
        url: 'https://smartaitest.com/ko/holiday-position/' + (posSlug ? 'p/' + posSlug.toLowerCase() + '/' : '')
      };
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        shareData.files = [file];
      }
      if (navigator.share) {
        navigator.share(shareData)
          .then(function () { track('hq_share_success'); })
          .catch(function (err) {
            if (!err || err.name !== 'AbortError') copyShareLink(shareData.text, shareData.url);
          });
      } else {
        copyShareLink(shareData.text, shareData.url);
      }
    });
  });

  $('saveBtn').addEventListener('click', function () {
    if (!currentPos) return;
    track('hq_save');
    renderCardPNG(currentPos, function (blob) {
      if (!blob) { $('saveBtn').textContent = '저장에 실패했어요'; setTimeout(function () { $('saveBtn').textContent = '이미지로 저장'; }, 1600); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'holiday-position.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    });
  });

  $('retryBtn').addEventListener('click', function () {
    track('hq_retry');
    showScreen('screen-intro');
  });
})();
</script>
<script src="/js/consent-manager.js"></script>
<script src="/js/analytics-events.js" defer></script>
</body>
</html>
