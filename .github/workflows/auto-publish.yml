name: Auto Blog Publisher (3x Weekly)

on:
  schedule:
    # Mon/Wed/Fri at 00:00 UTC = 09:00 KST
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Generate and publish post
      run: |
        echo "Current date (UTC): $(date)"
        echo "Current date (KST): $(TZ=Asia/Seoul date)"
        node scripts/generate-posts.js
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        git add -A
        
        # Check if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
        git commit -m "feat: auto-publish blog post for $TODAY"
        git push
