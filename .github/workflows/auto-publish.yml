name: Auto Blog Publisher (3x Weekly)

on:
  schedule:
    # Every Monday, Wednesday, Friday at 00:00 UTC (09:00 KST)
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Generate today's post
      working-directory: .
      run: |
        node scripts/generate-post.js
        echo "Post generation completed"

    - name: Check for new files
      id: check_changes
      run: |
        if [[ -n $(git status --porcelain blog/) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit new post
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add blog/
        git add config/content-schedule.json
        git commit -m "Auto-publish: $(date +%Y-%m-%d) - New blog post"
        git push

    - name: Deploy to production
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        echo "Deploying to production..."
        # Add your deployment command here
        # Example: Vercel, Netlify, FTP, SSH deploy, etc.
        # curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}
