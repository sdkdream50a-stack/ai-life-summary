body{font-family:'Inter',-apple-system,sans-serif;}
h1,h2,h3,h4,h5,h6{font-family:'Poppins',-apple-system,sans-serif;}
.pt-type-header{border-radius:1.5rem;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.pt-type-code{font-size:3.5rem;font-weight:800;letter-spacing:0.08em;color:#fff;text-shadow:0 0 40px rgba(255,255,255,0.4);}
.pt-type-emoji-lg{font-size:3rem;margin-bottom:0.5rem;}
.pt-type-name{font-size:1.4rem;font-weight:700;color:rgba(255,255,255,0.9);}
.pt-type-tagline{font-size:0.9rem;color:rgba(255,255,255,0.65);margin-top:0.25rem;}
.pt-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:1rem;padding:1.5rem;margin-bottom:1rem;}
.pt-card h3{font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.5);margin-bottom:0.75rem;}
.pt-card p{color:rgba(255,255,255,0.82);line-height:1.7;font-size:0.95rem;}
.pt-card ul{list-style:none;padding:0;margin:0;}
.pt-card ul li{color:rgba(255,255,255,0.82);font-size:0.9rem;padding:0.25rem 0;}
.pt-compatible-badge{display:inline-block;background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.4);border-radius:0.5rem;padding:0.35rem 0.75rem;font-size:0.85rem;color:#c4b5fd;margin:0.25rem;}
.pt-btn{display:inline-flex;align-items:center;justify-content:center;padding:0.75rem 1.75rem;border-radius:0.75rem;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.2s;border:none;}
.pt-btn-primary{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;}
.pt-btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.pt-btn-secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.pt-axis-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem;}
.pt-axis-letter{font-size:0.85rem;font-weight:700;color:rgba(255,255,255,0.4);width:1.2rem;text-align:center;}
.pt-axis-letter.pt-dominant{color:#a78bfa;}
.pt-axis-track{flex:1;height:0.5rem;background:rgba(255,255,255,0.1);border-radius:1rem;overflow:hidden;display:flex;}
.pt-axis-fill{height:100%;}
.pt-axis-left{background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:1rem 0 0 1rem;}
.pt-axis-right{background:linear-gradient(90deg,#ec4899,#f472b6);border-radius:0 1rem 1rem 0;}
.pt-axis-pct{font-size:0.75rem;color:#a78bfa;font-weight:600;width:2.5rem;text-align:right;}
.pt-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem;}
.pt-spinner{width:3rem;height:3rem;border:3px solid rgba(167,139,250,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
html[lang="ko"] body,html[lang="ja"] body,html[lang="zh"] body{word-break:keep-all;overflow-wrap:break-word;}
</style>
