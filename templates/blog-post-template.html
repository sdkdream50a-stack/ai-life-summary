<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{TITLE}} | AI Test Lab</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="https://smartaitest.com/blog/{{SLUG}}.html">

    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="https://smartaitest.com/assets/images/og-default.png">
    <meta property="og:url" content="https://smartaitest.com/blog/{{SLUG}}.html">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="{{LOCALE}}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="https://smartaitest.com/assets/images/og-default.png">

    <!-- Hreflang -->
    <link rel="alternate" hreflang="ko" href="https://smartaitest.com/blog/ko/{{SLUG}}.html">
    <link rel="alternate" hreflang="en" href="https://smartaitest.com/blog/en/{{SLUG}}.html">
    <link rel="alternate" hreflang="x-default" href="https://smartaitest.com/blog/{{SLUG}}.html">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                        heading: ['Inter', 'Noto Sans KR', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        .prose h2 { margin-top: 2rem; margin-bottom: 1rem; font-size: 1.5rem; font-weight: 700; color: #1f2937; }
        .prose h3 { margin-top: 1.5rem; margin-bottom: 0.75rem; font-size: 1.25rem; font-weight: 600; color: #374151; }
        .prose p { margin-bottom: 1rem; line-height: 1.8; color: #4b5563; }
        .prose ul, .prose ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .prose li { margin-bottom: 0.5rem; line-height: 1.7; color: #4b5563; }
        .prose ul li { list-style-type: disc; }
        .prose ol li { list-style-type: decimal; }
        .prose code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .prose pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .prose pre code { background: transparent; padding: 0; }
        .prose blockquote { border-left: 4px solid #4F46E5; padding-left: 1rem; margin: 1.5rem 0; font-style: italic; color: #6b7280; }
        .affiliate-box { background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); border: 1px solid #C7D2FE; border-radius: 0.75rem; padding: 1.5rem; margin: 2rem 0; }
        .affiliate-box h4 { color: #4338CA; font-weight: 600; margin-bottom: 0.75rem; }
        .affiliate-box a { color: #4F46E5; text-decoration: underline; font-weight: 500; }
        .affiliate-box a:hover { color: #3730A3; }
        .affiliate-disclaimer { font-size: 0.75rem; color: #6b7280; margin-top: 1rem; font-style: italic; }
    </style>

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{TITLE}}",
        "description": "{{DESCRIPTION}}",
        "datePublished": "{{PUBLISH_DATE}}",
        "dateModified": "{{PUBLISH_DATE}}",
        "author": {
            "@type": "Organization",
            "name": "AI Test Lab"
        },
        "publisher": {
            "@type": "Organization",
            "name": "AI Test Lab",
            "url": "https://smartaitest.com"
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://smartaitest.com/blog/{{SLUG}}.html"
        },
        "image": "https://smartaitest.com/assets/images/og-default.png"
    }
    </script>

    <!-- Google Consent Mode v2 defaults set by consent-manager.js -->
    <script src="/js/consent-manager.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="text-xl font-bold text-primary">AI Test Lab</a>
                <a href="/blog.html" class="text-gray-600 hover:text-primary">← Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Hero -->
        <div class="bg-gradient-to-br {{GRADIENT}} rounded-2xl p-8 mb-8 text-center">
            <span class="text-6xl mb-4 block">{{EMOJI}}</span>
            <span class="text-white/80 text-sm">Episode {{EPISODE}} · {{PUBLISH_DATE}}</span>
        </div>

        <!-- Article -->
        <article class="bg-white rounded-xl shadow-sm p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-6">{{TITLE}}</h1>

            <div class="prose max-w-none">
                {{CONTENT}}
            </div>

            <!-- Affiliate Box Placeholder -->
            {{AFFILIATE_BOX}}
        </article>

        <!-- Related Posts -->
        <div class="mt-8 bg-white rounded-xl shadow-sm p-6">
            <h3 class="font-bold text-lg mb-4">{{RELATED_TITLE}}</h3>
            <div class="grid md:grid-cols-2 gap-4">
                {{RELATED_POSTS}}
            </div>
        </div>

        <!-- Back to Blog -->
        <div class="mt-8 text-center">
            <a href="/blog.html" class="inline-flex items-center text-primary hover:underline">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                {{BACK_TO_BLOG}}
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <p class="text-gray-400">© 2026 AI Test Lab. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
