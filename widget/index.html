  <script>
    // i18n translations
    const i18n = {
      ko: {
        widgetGenerator: '위젯 생성기',
        selectStyle: '스타일',
        cardStyle: '카드',
        badgeStyle: '배지',
        miniStyle: '미니',
        selectType: '소울 타입',
        preview: '미리보기',
        copyImage: '이미지 복사',
        download: '다운로드',
        embedCode: '임베드',
        share: '공유',
        embedCodeTitle: '임베드 코드',
        copyCode: '코드 복사',
        copied: '복사됨!',
        copyFailed: '복사 실패'
      },
      en: {
        widgetGenerator: 'Widget Generator',
        selectStyle: 'Style',
        cardStyle: 'Card',
        badgeStyle: 'Badge',
        miniStyle: 'Mini',
        selectType: 'Soul Type',
        preview: 'Preview',
        copyImage: 'Copy Image',
        download: 'Download',
        embedCode: 'Embed',
        share: 'Share',
        embedCodeTitle: 'Embed Code',
        copyCode: 'Copy Code',
        copied: 'Copied!',
        copyFailed: 'Copy failed'
      },
      ja: {
        widgetGenerator: 'ウィジェット',
        selectStyle: 'スタイル',
        cardStyle: 'カード',
        badgeStyle: 'バッジ',
        miniStyle: 'ミニ',
        selectType: 'ソウルタイプ',
        preview: 'プレビュー',
        copyImage: '画像コピー',
        download: 'ダウンロード',
        embedCode: '埋め込み',
        share: '共有',
        embedCodeTitle: '埋め込みコード',
        copyCode: 'コードをコピー',
        copied: 'コピー完了!',
        copyFailed: 'コピー失敗'
      },
      zh: {
        widgetGenerator: '小部件',
        selectStyle: '样式',
        cardStyle: '卡片',
        badgeStyle: '徽章',
        miniStyle: '迷你',
        selectType: '灵魂类型',
        preview: '预览',
        copyImage: '复制图片',
        download: '下载',
        embedCode: '嵌入',
        share: '分享',
        embedCodeTitle: '嵌入代码',
        copyCode: '复制代码',
        copied: '已复制!',
        copyFailed: '复制失败'
      },
      es: {
        widgetGenerator: 'Widget',
        selectStyle: 'Estilo',
        cardStyle: 'Tarjeta',
        badgeStyle: 'Insignia',
        miniStyle: 'Mini',
        selectType: 'Tipo de Alma',
        preview: 'Vista Previa',
        copyImage: 'Copiar Imagen',
        download: 'Descargar',
        embedCode: 'Insertar',
        share: 'Compartir',
        embedCodeTitle: 'Código de Inserción',
        copyCode: 'Copiar Código',
        copied: '¡Copiado!',
        copyFailed: 'Error al copiar'
      }
    };

    let currentLang = 'ko';

    function detectLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const langParam = urlParams.get('lang');
      if (langParam && i18n[langParam]) return langParam;

      const saved = localStorage.getItem('ai-life-summary-lang');
      if (saved && i18n[saved]) return saved;

      const browserLang = navigator.language.split('-')[0];
      return i18n[browserLang] ? browserLang : 'ko';
    }

    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || i18n.en[key] || key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
    }

    // Get widget element
    function getWidgetElement() {
      const previewArea = document.getElementById('preview-area');
      return previewArea.querySelector('.widget-card, .widget-badge, .widget-mini');
    }

    // Copy image to clipboard
    async function copyImageToClipboard() {
      const widget = getWidgetElement();
      if (!widget) return;

      const btn = document.getElementById('btn-copy-image');
      const originalHTML = btn.innerHTML;

      // iOS/Safari detection - clipboard API is limited
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      if (isIOS || (isSafari && !navigator.clipboard?.write)) {
        // iOS/Safari: Download instead since clipboard is limited
        downloadImage();
        return;
      }

      try {
        const canvas = await html2canvas(widget, {
          backgroundColor: null,
          scale: 2
        });

        canvas.toBlob(async (blob) => {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);
            btn.innerHTML = `<span>✅</span><span>${t('copied')}</span>`;
            btn.classList.add('success');
            setTimeout(() => {
              btn.innerHTML = originalHTML;
              btn.classList.remove('success');
            }, 2000);
          } catch (err) {
            // Fallback: download instead
            downloadImage();
          }
        }, 'image/png');
      } catch (err) {
        console.error('Copy failed:', err);
        // Fallback: download instead
        downloadImage();
      }
    }

    // Download as PNG
    async function downloadImage() {
      const widget = getWidgetElement();
      if (!widget) return;

      const btn = document.getElementById('btn-download');
      const originalHTML = btn.innerHTML;

      try {
        btn.innerHTML = `<span>⏳</span><span>...</span>`;

        const canvas = await html2canvas(widget, {
          backgroundColor: '#1a1a2e',
          scale: 2,
          useCORS: true
        });

        const dataUrl = canvas.toDataURL('image/png');
        const fileName = `soul-type-${widgetGenerator.selectedType}.png`;

        // Mobile detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobile) {
          // Mobile: Show image in modal for long-press save
          showImageModal(dataUrl, fileName);
        } else {
          // Desktop: Normal download
          const link = document.createElement('a');
          link.download = fileName;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }

        btn.innerHTML = `<span>✅</span><span>${t('copied')}</span>`;
        btn.classList.add('success');
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.classList.remove('success');
        }, 2000);
      } catch (err) {
        console.error('Download failed:', err);
        btn.innerHTML = originalHTML;
        alert(currentLang === 'ko' ? '저장에 실패했습니다.' : 'Save failed.');
      }
    }

    // Show image modal for mobile save
    function showImageModal(dataUrl, fileName) {
      // Remove existing modal if any
      const existing = document.getElementById('save-image-modal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'save-image-modal';
      modal.style.cssText = `
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      `;

      modal.innerHTML = `
        <button id="close-save-modal" style="
          position: absolute;
          top: 20px;
          right: 20px;
          background: rgba(255,255,255,0.2);
          border: none;
          color: white;
          font-size: 24px;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          cursor: pointer;
        ">&times;</button>
        <p style="color: white; margin-bottom: 16px; text-align: center; font-size: 14px;">
          ${currentLang === 'ko' ? '👇 이미지를 길게 눌러 저장하세요' : '👇 Long press image to save'}
        </p>
        <img src="${dataUrl}" style="
          max-width: 90%;
          max-height: 60vh;
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        " alt="Widget">
        <p style="color: rgba(255,255,255,0.6); margin-top: 16px; font-size: 12px;">
          ${fileName}
        </p>
      `;

      document.body.appendChild(modal);

      // Close handlers
      document.getElementById('close-save-modal').onclick = () => modal.remove();
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }

    // Show embed modal
    function showEmbedModal() {
      const dimensions = {
        card: { width: 300, height: 200 },
        badge: { width: 200, height: 60 },
        mini: { width: 100, height: 100 }
      };

      const dim = dimensions[widgetGenerator.selectedStyle];
      const embedUrl = `https://smartaitest.com/widget/embed.html?type=${widgetGenerator.selectedType}&style=${widgetGenerator.selectedStyle}&lang=${currentLang}`;

      const code = `<iframe src="${embedUrl}" width="${dim.width}" height="${dim.height}" frameborder="0" style="border:none;"></iframe>`;

      document.getElementById('embed-code').textContent = code;
      document.getElementById('embed-modal').classList.add('show');
    }

    // Copy embed code
    async function copyEmbedCode() {
      const code = document.getElementById('embed-code').textContent;
      const btn = document.getElementById('btn-copy-code');
      const originalHTML = btn.innerHTML;

      try {
        await navigator.clipboard.writeText(code);
        btn.innerHTML = `<span>✅</span><span>${t('copied')}</span>`;
        btn.classList.add('success');
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.classList.remove('success');
        }, 2000);
      } catch (err) {
        console.error('Copy failed:', err);
      }
    }

    // Share with image
    async function shareWidget() {
      const widget = getWidgetElement();
      const btn = document.getElementById('btn-share');
      const originalHTML = btn.innerHTML;

      const soulType = widgetGenerator.soulTypes?.find(t => t.id === widgetGenerator.selectedType);
      const shareText = currentLang === 'ko'
        ? `나의 AI 소울 타입: ${soulType?.nameKo || ''} ✨`
        : `My AI Soul Type: ${soulType?.nameEn || ''} ✨`;
      const shareUrl = 'https://smartaitest.com/life-summary/';

      btn.innerHTML = `<span>⏳</span><span>...</span>`;

      try {
        // Generate image
        const canvas = await html2canvas(widget, {
          backgroundColor: '#1a1a2e',
          scale: 2,
          useCORS: true
        });

        // Convert to blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], `soul-type-${widgetGenerator.selectedType}.png`, { type: 'image/png' });

        // Try Web Share API with file (mobile)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'AI Soul Type',
            text: shareText,
            files: [file]
          });
          btn.innerHTML = originalHTML;
          return;
        }

        // Fallback: Web Share without file
        if (navigator.share) {
          await navigator.share({
            title: 'AI Soul Type',
            text: shareText,
            url: shareUrl
          });
          btn.innerHTML = originalHTML;
          return;
        }

        // Last fallback: copy link
        await navigator.clipboard.writeText(shareUrl);
        btn.innerHTML = `<span>✅</span><span>${t('copied')}</span>`;
        btn.classList.add('success');
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.classList.remove('success');
        }, 2000);

      } catch (err) {
        console.log('Share error:', err);
        btn.innerHTML = originalHTML;
        // If user cancelled, don't show error
        if (err.name !== 'AbortError') {
          // Show save modal as fallback
          try {
            const canvas = await html2canvas(widget, { backgroundColor: '#1a1a2e', scale: 2 });
            showImageModal(canvas.toDataURL('image/png'), `soul-type-${widgetGenerator.selectedType}.png`);
          } catch (e) {
            alert(currentLang === 'ko' ? '공유에 실패했습니다.' : 'Share failed.');
          }
        }
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Helper to add both click and touch events
      function addButtonListener(id, handler) {
        const btn = document.getElementById(id);
        if (!btn) return;

        btn.addEventListener('click', handler);
        // Touch support for mobile
        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          handler(e);
        }, { passive: false });
      }

      addButtonListener('btn-copy-image', copyImageToClipboard);
      addButtonListener('btn-download', downloadImage);
      addButtonListener('btn-embed', showEmbedModal);
      addButtonListener('btn-share', shareWidget);
      addButtonListener('btn-copy-code', copyEmbedCode);

      document.getElementById('close-modal')?.addEventListener('click', () => {
        document.getElementById('embed-modal').classList.remove('show');
      });

      document.getElementById('embed-modal')?.addEventListener('click', (e) => {
        if (e.target.id === 'embed-modal') {
          document.getElementById('embed-modal').classList.remove('show');
        }
      });
    }

    // Initialize
    function init() {
      currentLang = detectLanguage();
      applyTranslations();
      widgetGenerator.initialize(currentLang);
      setupEventListeners();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
